name: Build FBLoginSample APK

on:
  workflow_dispatch: # Permette di avviare la compilazione manualmente con un clic
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica il codice del repository
        uses: actions/checkout@v4

      - name: Configura Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Dai i permessi di esecuzione a Gradle
        run: chmod +x gradlew

      - name: Compila l'APK di Debug
        run: ./gradlew :samples:FBLoginSample:assembleDebug

      - name: Carica l'APK generato
        uses: actions/upload-artifact@v4
        with:
          name: FBLoginSample-debug-apk
          path: samples/FBLoginSample/build/outputs/apk/debug/*.apk
